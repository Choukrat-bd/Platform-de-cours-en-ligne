<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue - ChoukrApp Academie</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css?v=5">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container" style="margin-top:32px">
    <h1 class="section-title">Catalogue des cours</h1>
    <p class="section-sub">Recherchez et filtrez les cours sans recharger la page.</p>

    <div class="card mb">
      <div class="grid grid-3">
        <div class="form-group" style="margin:0">
          <label for="q">Recherche</label>
          <input type="search" id="q" placeholder="Titre, mot-clé…">
        </div>
        <div class="form-group" style="margin:0">
          <label for="category">Catégorie</label>
          <select id="category"><option value="">Toutes</option></select>
        </div>
        <div class="form-group" style="margin:0">
          <label for="level">Niveau</label>
          <select id="level">
            <option value="">Tous</option>
            <option value="Debutant">Débutant</option>
            <option value="Intermediaire">Intermédiaire</option>
            <option value="Avance">Avancé</option>
          </select>
        </div>
      </div>
    </div>

    <div id="results" class="grid grid-3"><div class="spinner"></div></div>
  </main>

  <footer class="site-footer">&copy; 2026 ChoukrApp Academie — UPH</footer>

  <script src="/js/app.js?v=5"></script>
  <script>
    const results = qs('#results');
    let timer = null;

    async function loadCategories() {
      try {
        const { categories } = await API.get('/courses/categories');
        const sel = qs('#category');
        categories.forEach((c) => sel.insertAdjacentHTML('beforeend', `<option value="${esc(c)}">${esc(c)}</option>`));
      } catch {}
    }

    async function loadCourses() {
      results.innerHTML = '<div class="spinner"></div>';
      const params = new URLSearchParams();
      const q = qs('#q').value.trim(); if (q) params.set('q', q);
      const cat = qs('#category').value; if (cat) params.set('category', cat);
      const lvl = qs('#level').value; if (lvl) params.set('level', lvl);
      try {
        const { courses } = await API.get('/courses?' + params.toString());
        if (courses.length === 0) { results.innerHTML = '<div class="empty"><div class="big">🔍</div>Aucun cours ne correspond à votre recherche.</div>'; return; }
        results.innerHTML = courses.map(card).join('');
      } catch (e) { results.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`; }
    }

    function card(c) {
      const badge = c.enrolled ? `<span class="tag tag-success">Inscrit · ${c.progress}%</span>` : '';
      return `
        <article class="card course-card">
          ${coverTag(c)}
          <div class="course-body">
            <div class="flex between"><span class="tag">${esc(c.category || 'Général')}</span>${badge}</div>
            <h3>${esc(c.title)}</h3>
            <p class="muted">${esc((c.description || '').slice(0, 95))}${(c.description || '').length > 90 ? '…' : ''}</p>
            <div class="course-meta">
              <span>👨‍🏫 ${esc(c.enseignant || '')}</span>
              <span>📚 ${c.chapitres}</span>
              <span>🏷️ ${levelLabel(c.level)}</span>
              ${c.quiz_count ? `<span>📝 ${c.quiz_count} quiz</span>` : ''}
            </div>
            <div class="course-footer">
              <a class="btn btn-block" href="/course.html?id=${c.id}">${c.enrolled ? 'Continuer le cours' : 'Voir le cours'}</a>
            </div>
          </div>
        </article>`;
    }

    qs('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(loadCourses, 300); });
    qs('#category').addEventListener('change', loadCourses);
    qs('#level').addEventListener('change', loadCourses);

    loadCategories();
    loadCourses();
  </script>
</body>
</html>
